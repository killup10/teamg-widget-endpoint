<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OTT TV - Cabinet</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;color:#333;background:#f6f8f6}
nav.top{display:flex;align-items:center;gap:26px;padding:14px 34px;border-bottom:2px solid #22c55e;background:#fff;position:sticky;top:0;z-index:10}
.logo{font-weight:800;font-size:22px;color:#22c55e}.logo small{display:block;font-size:11px;font-weight:400;letter-spacing:3px}
.tabs{margin-left:auto;display:flex;gap:4px}
.tabs button{background:none;border:0;padding:10px 16px;font-size:15px;color:#555;cursor:pointer;font-family:inherit}
.tabs button.sel{background:#22c55e;color:#fff;border-radius:4px}
.wrap{max-width:1000px;margin:26px auto;padding:0 20px 60px}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 6px #0001;padding:20px;margin-bottom:18px}
h2{margin:0 0 12px;font-weight:400;font-size:22px}
input{background:#fff;border:1px solid #22c55e;border-radius:4px;color:#333;padding:10px;margin:3px;font-size:14px;font-family:inherit}
button.act{background:#22c55e;border:0;color:#fff;padding:10px 18px;border-radius:4px;cursor:pointer;margin:3px;font-family:inherit}
button.danger{background:#fff;border:1px solid #e53935;color:#e53935;padding:7px 12px;border-radius:4px;cursor:pointer}
button.plain{background:#fff;border:1px solid #aaa;color:#333;padding:7px 12px;border-radius:4px;cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #e0e0e0;padding:8px 6px;text-align:left}
.small{color:#888;font-size:12px}
.chk{display:inline-block;margin:3px 10px 3px 0;font-size:14px}
.dev{border:1px solid #e0e0e0;border-radius:6px;padding:12px;margin:10px 0}
.msg{font-size:13px;color:#22c55e}
</style>
</head>
<body>
<nav class="top">
  <div class="logo">OTT<small>player</small></div>
  <div class="tabs" id="tabs"></div>
</nav>
<div class="wrap" id="app"><p>Cargando...</p></div>
<script>
var KEY=sessionStorage.getItem("ottkey")||"";
if(!KEY)location.href="/web/";
var DATA=null,TAB="Home";
function api(p,m,b){
  return fetch(p,{method:m||"GET",headers:{"Content-Type":"application/json","x-admin-key":KEY},body:b?JSON.stringify(b):undefined})
    .then(function(r){if(r.status===403){location.href="/web/";throw new Error("auth");}if(!r.ok)throw new Error("HTTP "+r.status);return r.json();});
}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function refresh(){api("/api/ott/admin/overview").then(function(o){DATA=o;render();});}
var TABS=["Home","Playlists","Devices","Cabinet","Fake-users","Logout"];
function render(){
  var t=document.getElementById("tabs");t.innerHTML="";
  TABS.forEach(function(x){
    var b=document.createElement("button");b.textContent=x;if(x===TAB)b.className="sel";
    b.onclick=function(){
      if(x==="Logout"){sessionStorage.removeItem("ottkey");location.href="/web/";return;}
      TAB=x;render();
    };
    t.appendChild(b);
  });
  var a=document.getElementById("app"),un={};
  DATA.users.forEach(function(u){un[u.id]=u.login;});
  if(TAB==="Home"){
    a.innerHTML="<div class='card'><h2>Home</h2><p>Usuarios: <b>"+DATA.users.length+"</b> · Dispositivos: <b>"+DATA.devices.length+"</b> · Playlists: <b>"+DATA.playlists.length+"</b> <span class='small'>(store: "+esc(DATA.mode)+")</span></p><p class='small'>1. Crea fake-users para tus clientes · 2. Agrega tus M3U en Playlists · 3. Asigna listas en Devices · 4. El cliente actualiza con el botón rojo del TV.</p></div>";
  }
  if(TAB==="Cabinet"){
    a.innerHTML="<div class='card'><h2>Cabinet</h2><p>Plan: <b>OTT TV local</b></p><p>Usuarios: <b>"+DATA.users.length+"</b><br/>Dispositivos: <b>"+DATA.devices.length+"</b><br/>Playlists: <b>"+DATA.playlists.length+"</b></p></div>";
  }
  if(TAB==="Playlists"){
    var h="<div class='card'><h2>Playlists</h2><input id='pn' placeholder='Nombre' style='width:200px'/><input id='pu' placeholder='URL M3U' style='width:280px'/><input id='pe' placeholder='URL EPG (opcional)' style='width:280px'/><button class='act' id='bp'>Agregar</button> <span class='msg' id='pm'></span><br/><br/><table><tr><th>Nombre</th><th>URL</th><th></th></tr>";
    DATA.playlists.forEach(function(p){h+="<tr><td>"+esc(p.name)+"</td><td class='small'>"+esc(p.url)+"</td><td><button class='danger' data-dp='"+p.id+"'>Borrar</button></td></tr>";});
    a.innerHTML=h+"</table></div>";
    document.getElementById("bp").onclick=function(){
      api("/api/ott/admin/playlist","POST",{name:document.getElementById("pn").value.trim(),url:document.getElementById("pu").value.trim(),epgUrl:document.getElementById("pe").value.trim()}).then(function(){refresh();}).catch(function(e){document.getElementById("pm").textContent=e.message;});
    };
    bindDel("dp","playlist");
  }
  if(TAB==="Devices"){
    var h="<div class='card'><h2>Devices</h2>";
    if(!DATA.devices.length)h+="<p class='small'>Sin dispositivos. Aparecen cuando el cliente se loguea y registra su TV.</p>";
    DATA.devices.forEach(function(d){
      h+="<div class='dev'><b>"+esc(d.name)+"</b> <span class='small'>"+esc(d.id)+" · "+esc(un[d.userId]||d.userId)+" · "+esc(d.platform||"")+" · visto: "+esc(d.lastSeen||"-")+"</span> <button class='danger' data-dd='"+d.id+"'>Borrar</button><br/>";
      h+="<span class='small'>connected playlists:</span><br/>";
      DATA.playlists.forEach(function(p){
        var on=(d.playlists||[]).indexOf(p.id)>-1;
        h+="<label class='chk'><input type='checkbox' data-dev='"+d.id+"' value='"+p.id+"'"+(on?" checked":"")+"/>"+esc(p.name)+"</label>";
      });
      h+="<br/><button class='act' data-save='"+d.id+"'>OK</button></div>";
    });
    a.innerHTML=h+"</div>";
    bindDel("dd","device");
    var s=document.querySelectorAll("[data-save]");
    for(var i=0;i<s.length;i++)s[i].onclick=function(){
      var dev=this.getAttribute("data-save"),ids=[],c=document.querySelectorAll("input[data-dev='"+dev+"']");
      for(var j=0;j<c.length;j++)if(c[j].checked)ids.push(c[j].value);
      api("/api/ott/admin/assign","POST",{deviceId:dev,playlistIds:ids}).then(function(){alert("Guardado. El cliente pulsa el botón rojo.");refresh();});
    };
  }
  if(TAB==="Fake-users"){
    var h="<div class='card'><h2>Fake-users</h2><p class='small'>Usuarios extra para clientes, sin email. Compárteles su login + password.</p><input id='fu' placeholder='usuario'/><input id='fp' placeholder='password'/><button class='act' id='bf'>Crear</button> <span class='msg' id='fm'></span><br/><br/><table><tr><th>Login</th><th>Creado</th><th></th></tr>";
    DATA.users.forEach(function(u){h+="<tr><td>"+esc(u.login)+"</td><td class='small'>"+esc(u.created||"")+"</td><td><button class='danger' data-du='"+u.id+"'>Borrar</button></td></tr>";});
    a.innerHTML=h+"</table></div>";
    document.getElementById("bf").onclick=function(){
      api("/api/ott/admin/user","POST",{login:document.getElementById("fu").value.trim(),password:document.getElementById("fp").value}).then(function(){refresh();}).catch(function(e){document.getElementById("fm").textContent=e.message;});
    };
    bindDel("du","user");
  }
}
function bindDel(attr,kind){
  var b=document.querySelectorAll("[data-"+attr+"]");
  for(var i=0;i<b.length;i++)b[i].onclick=function(){
    if(!confirm("¿Borrar?"))return;
    api("/api/ott/admin/"+kind+"?id="+this.getAttribute("data-"+attr),"DELETE").then(refresh);
  };
}
refresh();
</script>
</body>
</html>

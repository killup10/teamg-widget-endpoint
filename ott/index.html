<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OTT TV</title>
<meta http-equiv="Cache-Control" content="no-cache" />
<style>
:root{--bg:#070744;--panel:#0d0d63;--panel2:#06063a;--bar:#0a0a52;--acc:#1e6fe0;--focus:#e53935;--txt:#fff;--mut:#aab3d6;--ok:#37d67a}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:Arial,Helvetica,sans-serif;font-size:15px}
body.theme-red{--bg:#450707;--panel:#630d0d;--panel2:#3a0606;--bar:#520a0a;--acc:#d81e1e}
body.theme-green{--bg:#073a1e;--panel:#0d5c30;--panel2:#063a1e;--bar:#0a5230;--acc:#1ed86f}
#app{height:100vh;display:flex;flex-direction:column}
/* top bar */
header.top{display:flex;align-items:center;gap:10px;background:var(--panel2);padding:8px 16px;border-bottom:1px solid #ffffff22}
.logo{font-weight:700;font-size:20px}
.logo b{color:var(--ok)}
#clock{margin-left:auto;color:#fff;font-size:16px}
#epgstate{font-size:12px;color:var(--mut)}
/* group tabs */
#tabs{display:flex;background:var(--panel2);overflow-x:auto;border-bottom:2px solid var(--acc);padding:0 8px}
.tab{padding:10px 22px;cursor:pointer;white-space:nowrap;color:var(--mut);font-size:16px;transform:skewX(-12deg);margin-right:4px;background:transparent;border:0;font-family:inherit}
.tab span{display:inline-block;transform:skewX(12deg)}
.tab.sel{background:var(--acc);color:#fff}
.tab.focused{outline:3px solid #fff;outline-offset:-3px}
/* setup */
#view-setup{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.setupbox{background:var(--panel);border:1px solid #ffffff33;border-radius:10px;padding:22px;width:600px;max-width:95vw}
.setupbox h2{margin:0 0 6px;color:#ffcf40}
.setupbox p{color:var(--mut);margin:0 0 8px;font-size:14px}
.setupbox label{display:block;margin-top:12px;font-size:14px;color:#fff}
input[type=text],input[type=url],select{width:100%;background:#06063a;border:1px solid #ffffff44;color:#fff;padding:12px;border-radius:6px;font-size:15px;box-sizing:border-box;font-family:inherit}
button{background:var(--acc);border:0;color:#fff;font-weight:700;padding:11px 16px;border-radius:6px;font-size:15px;cursor:pointer;margin:8px 6px 0 0;font-family:inherit}
button.green{background:var(--ok);color:#04120a}
button.ghost{background:transparent;border:1px solid #ffffff55}
button:focus{outline:3px solid #fff}
#status{color:var(--mut);font-size:13px;margin-top:10px}
#engine{color:var(--mut);font-size:12px;margin-top:6px}
/* grid */
#view-home{flex:1;display:none;flex-direction:column;min-height:0}
#grid{flex:1;overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-content:start}
@media(max-width:1100px){#grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:700px){#grid{grid-template-columns:repeat(3,1fr)}}
.tile{background:#00000055;border:2px solid transparent;border-radius:4px;padding:6px;cursor:pointer;position:relative;min-height:150px}
.tile.focused{border-color:var(--focus)}
.tile .num{position:absolute;top:2px;left:6px;font-size:13px;color:#fff;text-shadow:1px 1px 2px #000;z-index:2}
.tile img{width:100%;height:74px;object-fit:contain;background:#000;display:block}
.tile .nm{font-size:14px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ep{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tile .ep.live{color:var(--ok)}
.tile .bar{height:4px;background:#ffffff33;margin-top:4px;border-radius:2px}
.tile .bar i{display:block;height:100%;background:var(--ok);border-radius:2px}
#hicons{display:flex;gap:8px;margin-left:12px}
.ic{position:relative;width:44px;height:44px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff88;color:#fff;font-size:20px;cursor:pointer;margin:0;padding:0;font-family:inherit}
.ic i{position:absolute;left:8px;right:8px;bottom:-7px;height:4px;border-radius:2px}
.ic:focus{outline:3px solid #fff}
/* carpetas = playlists asignadas por el admin */
#view-folders{flex:1;display:none;flex-direction:column;min-height:0;overflow:auto;padding:16px}
#foldmsg{color:var(--mut);margin:4px 2px 12px}
#folders{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){#folders{grid-template-columns:repeat(2,1fr)}}
.folder{background:var(--panel);border:2px solid #ffffff33;border-radius:8px;padding:22px 12px;cursor:pointer;text-align:center;font-size:18px}
.folder .fi{font-size:40px}
.folder small{display:block;color:var(--mut);font-size:13px;margin-top:6px}
.folder.focused,.folder:focus{border-color:var(--focus);outline:3px solid #fff}
/* cuenta */
.accbox{background:#06063a;border:1px solid #ffffff44;border-radius:8px;padding:14px;margin-bottom:14px}
.accbox h3{margin:0 0 8px;color:#ffcf40;font-size:16px}
#accstatus{font-size:13px;color:var(--mut);margin-top:8px}
/* player */
#player{position:fixed;inset:0;background:#000;display:none;z-index:50}
#player.open{display:block}
#v{width:100%;height:100%;background:#000}
#topbar{position:absolute;top:0;left:0;right:0;padding:10px 16px;background:linear-gradient(rgba(0,0,0,.85),transparent);display:flex;gap:12px;align-items:center}
#topbar img#plogo{width:76px;height:44px;object-fit:contain;background:#000}
#ptitle{font-size:20px;font-weight:700}
#pres{font-size:14px;color:#ffd}
#topbar #pclock{margin-left:auto;font-size:16px}
#botbar{position:absolute;left:0;right:0;bottom:0;padding:10px 16px;background:linear-gradient(transparent,rgba(0,0,0,.9));display:flex;gap:14px;align-items:center}
.cbtn{width:46px;height:46px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff66;color:#fff;font-size:20px;cursor:pointer}
.cbtn:focus{outline:3px solid #fff}
#pp{flex:1}
#pepnow{font-size:14px}
#pprog{height:5px;background:#ffffff33;border-radius:3px;margin-top:5px}
#epbar{height:100%;background:#ff9a3c;border-radius:3px;width:0}
#ptime{font-size:14px;color:var(--ok);white-space:nowrap}
#plist{position:absolute;top:0;left:0;bottom:0;width:400px;max-width:80vw;background:rgba(5,5,40,.94);display:none;flex-direction:column;z-index:5}
#plist.open{display:flex}
#plist .ph{padding:12px 16px;font-size:18px;border-bottom:1px solid #ffffff33}
#prows{flex:1;overflow:auto;padding:6px 0}
.prow{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer}
.prow.focused,.prow.cur{background:#ffffff22;outline:2px solid var(--focus)}
.prow .n{width:34px;color:var(--mut)}
.prow img{width:52px;height:30px;object-fit:contain;background:#000}
.prow .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
#perror{position:absolute;left:5%;right:5%;bottom:14%;background:rgba(30,8,8,.94);border:1px solid var(--focus);border-radius:8px;padding:14px;display:none;font-size:14px;z-index:6}
#loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#fff;font-size:18px;z-index:4}
#zapnum{position:absolute;top:80px;right:30px;font-size:52px;font-weight:700;color:#fff;text-shadow:2px 2px 6px #000;display:none;z-index:6}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo">OTT <b>TV</b></div>
    <div id="hicons">
      <button class="ic" id="btnRed" title="Actualizar (botón rojo)">&#8635;<i class="r"></i></button>
      <button class="ic" id="btnAcc" title="Cuenta (botón verde)">&#9998;<i class="g"></i></button>
      <button class="ic" id="btnCfg" title="Ajustes (botón amarillo)">&#9881;<i class="y"></i></button>
    </div>
    <div id="epgstate"></div><div id="clock"></div>
  </header>

  <div id="view-setup">
    <div class="setupbox">
      <h2>Cuenta y listas</h2>
      <div class="accbox">
        <h3>Cuenta (la crea tu administrador)</h3>
        <label>Login (usuario)</label>
        <input id="accLogin" type="text" placeholder="usuario" autocomplete="off" />
        <label>Password</label>
        <input id="accPass" type="text" placeholder="password" autocomplete="off" />
        <label>Nombre del dispositivo</label>
        <input id="devName" type="text" placeholder="Ej. Living Samsung" />
        <div>
          <button id="btnLink" class="green">Guardar y registrar TV</button>
          <button id="btnUnlink" class="ghost">Cerrar sesión</button>
        </div>
        <div id="accstatus">Sin cuenta.</div>
      </div>
      <h2>Lista local (modo prueba)</h2>
      <p>La lista M3U y la gu&iacute;a EPG quedan guardadas en este TV.</p>
      <label>Lista M3U (URL o archivo)</label>
      <input id="m3uUrl" type="url" placeholder="https://tudominio.com/lista.m3u" />
      <div>
        <button id="btnLoad" class="green">Cargar URL</button>
        <button id="btnFile" class="ghost">Subir archivo</button>
        <button id="btnDemo" class="ghost">Demo</button>
        <button id="btnGo" class="ghost" style="display:none">Ver canales &rarr;</button>
        <input id="file" type="file" accept=".m3u,.m3u8,.txt" style="display:none" />
      </div>
      <label>Gu&iacute;a EPG XMLTV (opcional, se autodetecta url-tvg)</label>
      <input id="epgUrl" type="url" placeholder="https://tudominio.com/epg.xml" />
      <div><button id="btnEpg" class="ghost">Cargar EPG</button></div>
      <label>Tema de color</label>
      <select id="theme"><option value="">Azul</option><option value="theme-red">Rojo</option><option value="theme-green">Verde</option></select>
      <div id="status">Sin lista cargada.</div>
      <div id="engine">Motor: detectando...</div>
    </div>
  </div>

  <div id="view-home">
    <div id="tabs" tabindex="0"></div>
    <div id="grid" tabindex="0"></div>
  </div>

  <div id="view-folders">
    <div id="foldmsg"></div>
    <div id="folders"></div>
  </div>
</div>

<div id="player">
  <video id="v" playsinline></video>
  <div id="topbar">
    <img id="plogo" alt="" style="visibility:hidden" />
    <div><div id="ptitle">-</div><div id="pres">-</div></div>
    <div id="pclock"></div>
  </div>
  <div id="plist"><div class="ph" id="plistName">Canales</div><div id="prows"></div></div>
  <div id="zapnum"></div>
  <div id="loading">Cargando...</div>
  <div id="perror"></div>
  <div id="botbar">
    <button class="cbtn" id="btnList" title="Lista">&#9776;</button>
    <button class="cbtn" id="btnPP" title="Pausa">&#10074;&#10074;</button>
    <div id="pp"><div id="pepnow">-</div><div id="pprog"><div id="epbar"></div></div></div>
    <div id="ptime"></div>
    <button class="cbtn" id="btnBack" title="Volver">&#8629;</button>
  </div>
</div>

<script src="vendor/hls.min.js"></script>
<script>
(function(){
"use strict";
var LS_LIST="ottv2_list", LS_FAV="ottv2_fav", LS_HID="ottv2_hid", LS_URL="ottv2_url",
    LS_EPG="ottv2_epg", LS_EPGURL="ottv2_epgurl", LS_THEME="ottv2_theme";
var channels=[], groups=[], curGroup="__all", favs={}, hids={};
var EPGCH={}, EPGP={};
try{
  favs=JSON.parse(localStorage.getItem(LS_FAV)||"{}");
  hids=JSON.parse(localStorage.getItem(LS_HID)||"{}");
}catch(e){}
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function hostOf(u){try{var a=document.createElement("a");a.href=u;return a.hostname||u;}catch(e){return u;}}
function tick(){var d=new Date(),p=function(n){return(n<10?"0":"")+n;};var s=p(d.getDate())+"/"+p(d.getMonth()+1)+" "+p(d.getHours())+":"+p(d.getMinutes());$("clock").textContent=s;var c=$("pclock");if(c)c.textContent=s;}
tick();setInterval(function(){tick();refreshEpgLines();},30000);

/* tema */
(function(){try{var t=localStorage.getItem(LS_THEME)||"";if(t)document.body.className=t;$("theme").value=t;}catch(e){}})();
$("theme").onchange=function(){var t=$("theme").value;document.body.className=t;try{localStorage.setItem(LS_THEME,t);}catch(e){}};

/* motor */
var ENG="desconocido";
(function(){if(window.Hls&&Hls.isSupported())ENG="HLS.js local";else{var v=document.createElement("video");if(v.canPlayType&&v.canPlayType("application/vnd.apple.mpegurl"))ENG="Nativo del TV";else ENG="Sin HLS";}$("engine").textContent="Motor: "+ENG;})();

/* ---- M3U ---- */
function parseM3U(text){
  var lines=text.split(/\r?\n/),out=[],meta=null,i,ln,hl=text.split("\n")[0]||"";
  var autoEpg="";var m0=hl.match(/(url-tvg|tvg-url|x-tvg-url)="([^"]*)"/);if(m0)autoEpg=m0[2];
  for(i=0;i<lines.length;i++){
    ln=lines[i].replace(/^\uFEFF/,"").trim();if(!ln)continue;
    if(ln.indexOf("#EXTINF")===0){
      var parts=ln.split(","),name=(parts.length>1?parts.slice(1).join(","):"Sin nombre").trim();
      var logo="",group="General",tid="";
      var m1=ln.match(/tvg-logo="([^"]*)"/);if(m1)logo=m1[1];
      var m2=ln.match(/group-title="([^"]*)"/);if(m2&&m2[1])group=m2[1];
      var m3=ln.match(/tvg-id="([^"]*)"/);if(m3)tid=m3[1];
      meta={name:name,logo:logo,group:group,tid:tid};
    }else if(ln.charAt(0)!=="#"){if(meta){meta.url=ln;meta.id=meta.group+"||"+meta.name+"||"+ln;out.push(meta);meta=null;}}
  }
  return{list:out,autoEpg:autoEpg};
}
/* ---- EPG XMLTV ---- */
function epgTime(s){
  var m=/(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/.exec(s||"");if(!m)return 0;
  var t=Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]);
  var z=/(?:\s([+-])(\d{2})(\d{2}))?/.exec(s||"");
  if(z&&z[1]){var off=(+z[2])*60+(+z[3]);t+=(z[1]==="-"?off:-off)*60000;}
  return t;
}
function txt(el,tag){var n=el.getElementsByTagName(tag);if(n&&n.length&&n[0].firstChild)return n[0].firstChild.nodeValue;return"";}
function parseEPG(xml){
  var EPGCH={},EPGP={},i,j;
  var chs=xml.getElementsByTagName("channel");
  for(i=0;i<chs.length;i++){
    var id=chs[i].getAttribute("id");if(!id)continue;
    var ic=chs[i].getElementsByTagName("icon");
    EPGCH[id]={name:txt(chs[i],"display-name"),icon:(ic&&ic.length?ic[0].getAttribute("src"):"")};
  }
  var prs=xml.getElementsByTagName("programme");
  for(i=0;i<prs.length;i++){
    var c=prs[i].getAttribute("channel");if(!c)continue;
    var st=epgTime(prs[i].getAttribute("start")),sp=epgTime(prs[i].getAttribute("stop"));
    if(!st||!sp)continue;
    (EPGP[c]=EPGP[c]||[]).push({start:st,stop:sp,title:txt(prs[i],"title"),desc:txt(prs[i],"sub-title")||txt(prs[i],"desc")});
  }
  for(var k in EPGP){EPGP[k].sort(function(a,b){return a.start-b.start;});}
  return{ch:EPGCH,pr:EPGP};
}
function epgIdFor(c){
  if(c.tid&&EPGP[c.tid])return c.tid;
  var nm=(c.name||"").toLowerCase(),k;
  for(k in EPGCH){if((EPGCH[k].name||"").toLowerCase()===nm)return k;}
  for(k in EPGP){if(k.toLowerCase()===nm)return k;}
  return null;
}
function nowNext(c){
  var id=epgIdFor(c);if(!id||!EPGP[id])return null;
  var arr=EPGP[id],now=Date.now(),i;
  for(i=0;i<arr.length;i++){if(arr[i].start<=now&&now<arr[i].stop){return{now:arr[i],next:arr[i+1]||null};}}
  return null;
}
function epgCount(){var n=0,k;for(k in EPGP)n+=EPGP[k].length;return n;}
function epgBadge(){
  var n=epgCount();
  $("epgstate").textContent=n>0?("EPG ✓ "+n+" programas"):"EPG ✗";
}
function loadEPG(url,silent,cb){
  fetchText(url,function(err,text){
    if(err){if(!silent)$("status").textContent="EPG error: "+err.message;if(cb)cb(false);return;}
    try{
      var xml=new DOMParser().parseFromString(text,"text/xml");
      var r=parseEPG(xml);EPGCH=r.ch;EPGP=r.pr;
      try{localStorage.setItem(LS_EPGURL,url);}catch(e){}
      if(!silent)$("status").textContent="EPG: "+epgCount()+" programas en "+Object.keys(EPGP).length+" canales.";
      epgBadge();renderAll();if(cb)cb(true);
    }catch(e){if(!silent)$("status").textContent="EPG inválido.";if(cb)cb(false);}
  });
}

/* ---- listas ---- */
function saveList(t){try{localStorage.setItem(LS_LIST,t);}catch(e){}}
function loadSaved(){try{return localStorage.getItem(LS_LIST);}catch(e){return null;}}
function visible(){return channels.filter(function(c){return!hids[c.id];});}
function computeGroups(){var map={},i;for(i=0;i<channels.length;i++){if(!hids[channels[i].id])map[channels[i].group]=1;}groups=Object.keys(map).sort();}
function curList(){
  var base;
  if(curGroup==="__all")base=visible();
  else if(curGroup==="__fav")base=channels.filter(function(c){return favs[c.id]&&!hids[c.id];});
  else if(curGroup==="__hid")base=channels.filter(function(c){return hids[c.id];});
  else base=channels.filter(function(c){return c.group===curGroup&&!hids[c.id];});
  return base.slice(0,600);
}
function fmtT(ms){var d=new Date(ms),p=function(n){return(n<10?"0":"")+n;};return p(d.getHours())+":"+p(d.getMinutes());}

/* ---- render ---- */
var tileIdx=0,rows=[];
function renderTabs(){
  var t=$("tabs");t.innerHTML="";
  var defs=[["__all","Todos"],["__fav","Favoritos"],["__hid","Ocultos"]];
  var all=defs.concat(groups.map(function(g){return[g,g];}));
  for(var i=0;i<all.length;i++){
    (function(it){
      var b=document.createElement("button");b.className="tab"+(it[0]===curGroup?" sel":"");
      b.innerHTML="<span>"+esc(it[0]==="__all"?(it[1]+" ("+visible().length+")"):it[1])+"</span>";
      b.onclick=function(){curGroup=it[0];renderAll();focusTile(0);};
      b.onkeydown=function(e){if(e.key==="Enter"){curGroup=it[0];renderAll();focusTile(0);}};
      t.appendChild(b);
    })(all[i]);
  }
}
function renderGrid(){
  var g=$("grid");g.innerHTML="";rows=curList();
  for(var i=0;i<rows.length;i++){g.appendChild(tile(rows[i],i));}
}
function tile(c,idx){
  var d=document.createElement("div");d.className="tile";d.tabIndex=0;
  var nn=nowNext(c);
  var epHtml=nn?('<div class="ep live">'+esc(nn.now.title)+'</div><div class="bar"><i style="width:'+epPct(nn.now)+'%"></i></div>'):'<div class="ep">...</div>';
  d.innerHTML='<div class="num">'+(idx+1)+'</div>'+
    (c.logo?'<img alt="" src="'+c.logo.replace(/"/g,"")+'"/>':'<img alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"/>')+
    '<div class="nm">'+esc(c.name)+(favs[c.id]?" ★":"")+'</div>'+epHtml;
  var img=d.getElementsByTagName("img")[0];img.onerror=function(){img.style.visibility="hidden";};
  d.setAttribute("data-ch",c.id);
  d.onclick=function(){playAt(idx);};
  d.onkeydown=function(e){if(e.key==="Enter")playAt(idx);};
  d.onfocus=function(){tileIdx=idx;};
  return d;
}
function epPct(p){var n=Date.now();if(p.stop<=p.start)return 0;return Math.max(0,Math.min(100,Math.round((n-p.start)/(p.stop-p.start)*100)));}
function refreshEpgLines(){
  if($("view-home").style.display!=="flex")return;
  var tiles=$("grid").getElementsByClassName("tile");
  for(var i=0;i<tiles.length&&i<rows.length;i++){
    (function(d,c){
      var nn=nowNext(c);if(!nn)return;
      var eps=d.getElementsByClassName("ep");if(eps.length){eps[0].className="ep live";eps[0].textContent=nn.now.title;}
      var bars=d.getElementsByClassName("bar");if(bars.length){var b=bars[0].getElementsByTagName("i");if(b.length)b[0].style.width=epPct(nn.now)+"%";}
    })(tiles[i],rows[i]);
  }
}
function focusTile(i){
  var ts=$("grid").getElementsByClassName("tile");if(!ts.length)return;
  if(i<0)i=0;if(i>=ts.length)i=ts.length-1;tileIdx=i;ts[i].focus();
}
function renderAll(){renderTabs();renderGrid();}
function showHome(){$("view-setup").style.display="none";$("view-folders").style.display="none";$("view-home").style.display="flex";computeGroups();renderAll();}
function showSetup(){$("view-home").style.display="none";$("view-folders").style.display="none";$("view-setup").style.display="flex";paintAcc();}

/* ---- player ---- */
var hls=null,pi=0,plistOpen=false,hideT=null,zapBuf="",zapT=null;
function showBars(){$("topbar").style.display="";$("botbar").style.display="";clearTimeout(hideT);hideT=setTimeout(function(){$("topbar").style.display="none";$("botbar").style.display="none";},5000);}
function perr(t,d){var e=$("perror");e.innerHTML="<b>"+esc(t)+"</b><br>"+esc(d);e.style.display="block";}
function playAt(i){
  var list=curList();if(!list.length)return;
  if(i<0)i=list.length-1;if(i>=list.length)i=0;pi=i;
  var c=list[i];
  $("perror").style.display="none";$("player").classList.add("open");
  $("ptitle").textContent=(i+1)+". "+c.name;$("pres").textContent=c.group;
  var lg=$("plogo");if(c.logo){lg.src=c.logo;lg.style.visibility="";lg.onerror=function(){lg.style.visibility="hidden";};}else lg.style.visibility="hidden";
  paintEpgBar(c);showBars();openList(false);
  $("loading").style.display="flex";
  var v=$("v");
  try{if(hls){hls.destroy();hls=null;}}catch(e){}
  v.pause();v.removeAttribute("src");v.load();
  if(/\.m3u8($|\?)/i.test(c.url)&&window.Hls&&Hls.isSupported()){
    hls=new Hls({maxBufferLength:20});
    hls.on(Hls.Events.MANIFEST_PARSED,function(){var p=v.play();if(p&&p.catch)p.catch(function(){});});
    hls.on(Hls.Events.ERROR,function(ev,d){if(d.fatal){$("loading").style.display="none";perr("Error de señal",d.type+" / "+d.details);}});
    hls.loadSource(c.url);hls.attachMedia(v);
  }else{
    v.src=c.url;var pr=v.play();if(pr&&pr.catch)pr.catch(function(e){$("loading").style.display="none";perr("No se pudo reproducir",String(e&&e.message||e));});
  }
  $("btnBack").focus();
}
function paintEpgBar(c){
  var nn=nowNext(c);
  if(nn){
    var s=fmtT(nn.now.start)+" - "+fmtT(nn.now.stop);
    $("pepnow").textContent=nn.now.title+(nn.next?("  ·  Siguiente: "+nn.next.title):"");
    $("epbar").style.width=epPct(nn.now)+"%";
    var el=Math.max(0,Date.now()-nn.now.start),to=nn.now.stop-nn.now.start;
    $("ptime").textContent=mmss(el)+" of "+mmss(to);
  }else{$("pepnow").textContent="Sin guía";$("epbar").style.width="0";$("ptime").textContent="";}
}
function mmss(ms){var s=Math.floor(ms/1000),m=Math.floor(s/60);s=s%60;return m+":"+(s<10?"0":"")+s;}
function stop(){var v=$("v");v.pause();try{if(hls){hls.destroy();hls=null;}}catch(e){}$("player").classList.remove("open");openList(false);renderAll();focusTile(pi);}
function openList(o){
  plistOpen=o;$("plist").className=o?"open":"";
  if(o)paintList();
}
function paintList(){
  var box=$("prows");box.innerHTML="";var list=curList();
  $("plistName").textContent=(curGroup==="__all"?"Todos":curGroup)+" ("+list.length+")";
  for(var i=0;i<list.length;i++){
    (function(c,idx){
      var d=document.createElement("div");d.className="prow"+(idx===pi?" cur":"");d.tabIndex=0;
      d.innerHTML='<div class="n">'+(idx+1)+'</div>'+(c.logo?'<img alt="" src="'+c.logo.replace(/"/g,"")+'"/>':'')+'<div class="t">'+esc(c.name)+'</div>';
      var im=d.getElementsByTagName("img")[0];if(im)im.onerror=function(){im.style.display="none";};
      d.onclick=function(){playAt(idx);};
      d.onkeydown=function(e){if(e.key==="Enter")playAt(idx);};
      box.appendChild(d);
      if(idx===pi)setTimeout(function(){d.focus();},50);
    })(list[i],i);
  }
}
function zapDigit(d){
  zapBuf+=d;var z=$("zapnum");z.textContent=zapBuf;z.style.display="block";showBars();
  clearTimeout(zapT);zapT=setTimeout(function(){
    var n=parseInt(zapBuf,10);zapBuf="";z.style.display="none";
    if(n>=1)playAt(n-1);
  },1200);
}
(function wire(){
  var v=$("v");
  v.addEventListener("playing",function(){
    $("loading").style.display="none";
    var w=v.videoWidth||0,h=v.videoHeight||0;
    if(w>0)$("pres").textContent=(curList()[pi]?curList()[pi].group+" · ":"")+w+"x"+h;
    else perr("Audio sin video","Este TV no decodifica la imagen (probable HEVC).");
  });
  v.addEventListener("waiting",function(){$("loading").style.display="flex";});
  v.addEventListener("error",function(){if(v.getAttribute("src")){$("loading").style.display="none";perr("Error de señal","Formato o códec no soportado.");}});
  v.addEventListener("pause",function(){$("btnPP").innerHTML="&#9654";});
  v.addEventListener("play",function(){$("btnPP").innerHTML="&#10074;&#10074;";});
})();
$("btnBack").onclick=stop;
$("btnList").onclick=function(){openList(!plistOpen);};
$("btnPP").onclick=function(){var v=$("v");if(v.paused)v.play();else v.pause();showBars();};

/* ---- carga ---- */
function fetchText(u,cb){
  if(window.fetch){fetch(u).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.text();}).then(function(t){cb(null,t);}).catch(function(e){cb(e);});}
  else{var x=new XMLHttpRequest();x.open("GET",u,true);x.onreadystatechange=function(){if(x.readyState===4){if(x.status>=200&&x.status<300)cb(null,x.responseText);else cb(new Error("HTTP "+x.status));}};x.onerror=function(){cb(new Error("red"));};x.send();}
}
function applyText(text,src){
  var r=parseM3U(text);
  channels=r.list;
  if(!channels.length){$("status").textContent="No se encontraron canales.";return false;}
  saveList(text);try{if(src)localStorage.setItem(LS_URL,src);}catch(e){}
  curGroup="__all";
  $("status").textContent=channels.length+" canales cargados"+(src?" desde "+src:"")+".";
  $("btnGo").style.display="";
  if(r.autoEpg){$("epgUrl").value=r.autoEpg;loadEPG(r.autoEpg,true);}
  computeGroups();return true;
}
$("btnLoad").onclick=function(){
  var u=$("m3uUrl").value.trim();if(!u){$("status").textContent="Pega primero la URL.";return;}
  $("status").textContent="Descargando lista...";
  fetchText(u,function(err,text){if(err){$("status").textContent="Error: "+err.message+". Prueba subir el archivo.";return;}if(applyText(text,u))showHome();});
};
$("btnFile").onclick=function(){$("file").click();};
$("file").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){if(applyText(r.result,"archivo: "+f.name))showHome();};r.readAsText(f);};
$("btnDemo").onclick=function(){var d="#EXTM3U\n#EXTINF:-1 group-title=\"Demo\",Canal Demo HLS\nhttps://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8\n";if(applyText(d,"demo"))showHome();};
$("btnGo").onclick=showHome;
$("btnEpg").onclick=function(){var u=$("epgUrl").value.trim();if(!u){$("status").textContent="Pega la URL del XMLTV.";return;}$("status").textContent="Descargando EPG...";loadEPG(u,false);};

/* teclas */
document.addEventListener("keydown",function(e){
  var open=$("player").classList.contains("open"),kc=e.keyCode||0;
  if(open){
    showBars();
    if(kc>=48&&kc<=57){zapDigit(String(kc-48));e.preventDefault();return;}
    if(kc>=96&&kc<=105){zapDigit(String(kc-96));e.preventDefault();return;}
    if(plistOpen){
      if(e.key==="Backspace"||e.key==="Escape"||kc===461||kc===10009||kc===403){openList(false);e.preventDefault();}
      return;
    }
    if(e.key==="ArrowUp"){playAt(pi-1);e.preventDefault();return;}
    if(e.key==="ArrowDown"){playAt(pi+1);e.preventDefault();return;}
    if(e.key==="Enter"){openList(true);e.preventDefault();return;}
    if(e.key==="Backspace"||e.key==="Escape"||kc===461||kc===10009||kc===403){stop();e.preventDefault();return;}
    return;
  }
  if($("view-home").style.display!=="flex"&&$("view-folders").style.display!=="flex")return;
  var tag=(document.activeElement&&document.activeElement.tagName)||"";
  if(tag==="INPUT"||tag==="SELECT")return;
  if(e.key==="Backspace"||e.key==="Escape"||kc===461||kc===10009){
    if(FOLDERS.length&&$("view-home").style.display==="flex"){showFolders();}
    else showSetup();
    e.preventDefault();return;
  }
  if(kc===403){if(ACC.token)doFeed(true);else showSetup();e.preventDefault();return;}
  if($("view-folders").style.display==="flex")return;
  if(kc===404){var c=rows[tileIdx];if(c){if(favs[c.id])delete favs[c.id];else favs[c.id]=1;try{localStorage.setItem(LS_FAV,JSON.stringify(favs));}catch(x){}renderAll();focusTile(tileIdx);}e.preventDefault();return;}
  if(kc===405){var c2=rows[tileIdx];if(c2){if(hids[c2.id])delete hids[c2.id];else hids[c2.id]=1;try{localStorage.setItem(LS_HID,JSON.stringify(hids));}catch(x){}computeGroups();renderAll();focusTile(Math.min(tileIdx,rows.length-1));}e.preventDefault();return;}
  var cols=6;
  if(e.key==="ArrowRight"){focusTile(tileIdx+1);e.preventDefault();}
  else if(e.key==="ArrowLeft"){focusTile(tileIdx-1);e.preventDefault();}
  else if(e.key==="ArrowDown"){focusTile(tileIdx+cols);e.preventDefault();}
  else if(e.key==="ArrowUp"){if(tileIdx-cols<0){var tb=$("tabs").getElementsByClassName("tab");if(tb.length)tb[0].focus();}else focusTile(tileIdx-cols);e.preventDefault();}
});

/* ---- cuenta OTT: login + NEW DEVICE + carpetas del admin ---- */
var ACC={},FOLDERS=[],curFolder=null;
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function loadAcc(){try{ACC=JSON.parse(lsGet("ottv2_acc")||"{}")||{};}catch(e){ACC={};}}
function saveAcc(){lsSet("ottv2_acc",JSON.stringify(ACC));}
function apiBase(){return location.protocol+"//"+location.host;}
function apiReq(method,p,b,cb){
  var u=apiBase()+p;
  if(window.fetch){
    fetch(u,{method:method,headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined})
      .then(function(r){return r.text().then(function(t){return{st:r.status,tx:t};});})
      .then(function(o){var j=null;try{j=JSON.parse(o.tx);}catch(e){}cb(o.st,j,o.tx);})
      .catch(function(e){cb(0,null,String(e));});
  }else{
    var x=new XMLHttpRequest();x.open(method,u,true);x.setRequestHeader("Content-Type","application/json");
    x.onreadystatechange=function(){if(x.readyState===4){var j=null;try{j=JSON.parse(x.responseText);}catch(e){}cb(x.status,j,x.responseText);}};
    x.onerror=function(){cb(0,null,"red");};x.send(b?JSON.stringify(b):null);
  }
}
function platformName(){
  var ua=navigator.userAgent||"";
  if(ua.indexOf("Tizen")>-1)return "SamsungTV";
  if(ua.indexOf("Web0S")>-1||ua.indexOf("webOS")>-1)return "LGTV";
  if(ua.indexOf("NetCast")>-1)return "LGNetCast";
  if(ua.indexOf("Android")>-1)return "AndroidTV";
  return "SmartTV";
}
function devId(){
  var d=lsGet("ottv2_dev");
  if(!d){d="tv-"+Math.random().toString(36).slice(2,10);lsSet("ottv2_dev",d);}
  return d;
}
function accStatus(t){$("accstatus").textContent=t;}
function paintAcc(){
  $("accLogin").value=ACC.login||"";
  if(!ACC.deviceName)ACC.deviceName=platformName();
  $("devName").value=ACC.deviceName||"";
  if(ACC.token)accStatus("Conectado como "+(ACC.login||"")+" · TV: "+(ACC.deviceName||""));
  else accStatus("Sin cuenta.");
}
function doLink(){
  var l=$("accLogin").value.trim(),p=$("accPass").value,dn=$("devName").value.trim()||platformName();
  if(!l||!p){accStatus("Escribe usuario y password.");return;}
  accStatus("Verificando...");
  apiReq("POST","/api/ott/login",{login:l,password:p},function(st,j){
    if(st!==200||!j||!j.ok){accStatus(((j&&j.error)||"Login incorrecto."));return;}
    ACC={token:j.token,login:l,deviceName:dn,deviceId:devId()};saveAcc();
    accStatus("Registrando TV...");
    apiReq("POST","/api/ott/device",{token:ACC.token,deviceId:ACC.deviceId,name:dn,platform:platformName()},function(st2,j2){
      if(st2!==200||!j2||!j2.ok){accStatus("Error registrando TV: "+((j2&&j2.error)||st2));return;}
      paintAcc();doFeed(false);
    });
  });
}
function doUnlink(){ACC={};saveAcc();FOLDERS=[];curFolder=null;paintAcc();showSetup();}
function doFeed(fromRed){
  if(!ACC.token){if(fromRed)showSetup();return;}
  if(fromRed)$("foldmsg").textContent="Actualizando...";
  apiReq("GET","/api/ott/feed?token="+encodeURIComponent(ACC.token)+"&deviceId="+encodeURIComponent(ACC.deviceId||devId()),null,function(st,j){
    if(st!==200||!j||!j.ok){$("foldmsg").textContent="Sesión vencida. Entra a Cuenta (botón verde).";showFolders();return;}
    FOLDERS=j.playlists||[];
    showFolders();
    if(!FOLDERS.length)$("foldmsg").textContent="TV registrado como "+(ACC.deviceName||"")+". Aún sin listas: avisa a tu administrador y pulsa el botón rojo para actualizar.";
  });
}
function showFolders(){
  $("view-setup").style.display="none";$("view-home").style.display="none";
  var f=$("view-folders");f.style.display="flex";
  var box=$("folders");box.innerHTML="";
  if(FOLDERS.length&&ACC.login)$("foldmsg").textContent="Carpetas de "+ACC.login+" · TV "+(ACC.deviceName||"")+" · OK para abrir";
  for(var i=0;i<FOLDERS.length;i++){
    (function(fd,idx){
      var d=document.createElement("div");d.className="folder";d.tabIndex=0;
      d.innerHTML='<div class="fi">📁</div>'+esc(fd.name)+'<small>Abrir</small>';
      d.onclick=function(){openFolder(idx);};
      d.onkeydown=function(e){if(e.key==="Enter")openFolder(idx);};
      box.appendChild(d);
      if(idx===0)setTimeout(function(){var f0=box.getElementsByClassName("folder");if(f0.length&&document.activeElement===document.body)f0[0].focus();},100);
    })(FOLDERS[i],i);
  }
}
function openFolder(idx){
  var fd=FOLDERS[idx];if(!fd)return;curFolder=fd;
  $("foldmsg").textContent="Cargando "+fd.name+"...";
  var murl=apiBase()+"/api/ott/m3u?token="+encodeURIComponent(ACC.token)+"&deviceId="+encodeURIComponent(ACC.deviceId||devId())+"&pid="+encodeURIComponent(fd.id);
  fetchText(murl,function(err,text){
    if(err){$("foldmsg").textContent="Error cargando lista.";return;}
    if(applyText(text,"carpeta: "+fd.name)){showHome();}
    if(fd.epg)loadEPG(apiBase()+"/api/ott/epg?token="+encodeURIComponent(ACC.token)+"&deviceId="+encodeURIComponent(ACC.deviceId||devId())+"&pid="+encodeURIComponent(fd.id),true);
  });
}
$("btnLink").onclick=doLink;
$("btnUnlink").onclick=doUnlink;
$("btnRed").onclick=function(){doFeed(true);};
$("btnAcc").onclick=function(){showSetup();setTimeout(function(){$("accLogin").focus();},50);};
$("btnCfg").onclick=function(){showSetup();};

/* init */
(function init(){
  loadAcc();paintAcc();
  var u=null,g=null;try{u=localStorage.getItem(LS_URL);g=localStorage.getItem(LS_EPGURL);}catch(e){}
  if(u)$("m3uUrl").value=u;if(g)$("epgUrl").value=g;
  var t=loadSaved();
  if(t){var r=parseM3U(t);channels=r.list;if(channels.length){$("status").textContent=channels.length+" canales guardados. Pulsa Ver canales.";$("btnGo").style.display="";}}
  if(g)loadEPG(g,true);
  epgBadge();
})();
})();
</script>
